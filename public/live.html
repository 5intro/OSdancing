<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>

    <title>舞动的算法</title>
    <meta http-equiv="Content-type" content="text/html; charset=UTF-8"/>
    <!-- 新 Bootstrap5 核心 CSS 文件 -->
    <link rel="stylesheet" href="/css/bootstrap.css">
    <link rel="stylesheet" href="/css/live.css">

    <!--  popper.min.js 用于弹窗、提示、下拉菜单 -->
    <script src="/js/jq.js"></script>
    <!-- 最新的 Bootstrap5 核心 JavaScript 文件 -->
    <script src="/js/bootstrap.js"></script>
    <script src="/js/index.js" type="module"></script>
    <script type="text/javascript" src="/js/main.js" charset="utf-8"></script>
    <style type="text/css">
        button {
            display: inline-block; /* 或者 inline-flex，取决于你想要的行为 */
            white-space: nowrap; /* 防止文字折行 */
        / / width: max-content; /* 使宽度适应内容 */
        }
    </style>
</head>

<body>
<div class="card" style="margin-top: 50px;">
    <div class="card-header" id="cardHeader">
    </div>
    <div class="card-body" id="cardBody" style="margin: 0 auto">
        <div id="app" style="height: 100%">
            <div>
                <div id="optionsPane" style="display: flex; width: 100%; justify-content: space-between">
                    <select id="cumulativeModeSelector" class="form-select">
                        <option value="false">隐藏已退出的栈的工作记录 [默认]</option>
                        <option value="true">显示已退出的栈的工作记录</option>
                    </select>
                    <select id="heapPrimitivesSelector" class="form-select" style="margin-left: 20px;">
                        <option value="false">渲染嵌套对象</option>
                        <option selected value="nevernest">不渲染嵌套对象 [默认]</option>
                        <option value="true">渲染堆上所有对象</option>
                    </select>
                    <select id="textualMemoryLabelsSelector" class="form-select" style="margin-left: 20px;">
                        <option value="false">使用箭头作为指针 [默认]</option>
                        <option value="true">使用文字标识作为指针</option>
                    </select>
                </div>

            </div>
            <div style="display: flex">
                <div style="display: flex;">
                    <div id="pyInputPane" style="margin-left: 10px;">
                        <div style="display: flex; justify-content: space-between; align-items: center">
                            <div id="codeInputWarnings" class="lead" style="margin-right: 20px;">

                                <select id="pythonVersionSelector" class="form-select">
                                    <option value="3" selected>Python 3.6</option>
                                    <option value="java">Java 8</option>
                                    <option value="cpp">C/C++ (gcc 4.8, C++11)</option>
                                </select>

                            </div>
                        </div>


                        <div id="someoneIsTypingDiv" style="color: #e93f34; font-weight: bold; display: none;">Someone is
                            typing ...
                        </div>

                        <div id="codeInputPane" style=" height: 600px;"></div>
                        <!-- populate with Ace code editor instance -->
                        <div id="frontendErrorOutput"></div>

                        <p>
                            <button id="executeBtn" class="btn btn-primary">代码可视化</button>
                            <!--                        <button style="margin-left: 20px;" id="liveModeBtn" class="btn btn-primary">实时演示</button>-->
                        </p>


                        <div id="instructionsPane"></div>

                        <div id="javaOptionsPane" style="margin-top: 20px;">
                            <!--[<i>coming soon!</i>] Java options: pass in command-line arguments and feed user input to stdin-->
                        </div>


                        <!--                        <div id="testCasesParent"></div>-->

                        <!--                        <div id="exampleSnippets"></div>-->

                    </div>


                    <div id="pyOutputPane"></div>

                    <div id="chat_div"></div>

                </div>

            </div>


        </div>

    </div>

</div>
<div>
</div>

</body>

</html>
